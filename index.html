<style>
:root{--bg:#060908;--panel:#101b13;--green:#9cc78d;--red:#c73b45;--text:#edf4e9;--muted:#a7b3a4}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(circle at 80% 0%,#19351f 0,#060908 38%);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.7}
a{color:inherit;text-decoration:none}
.nav{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:16px 7%;background:#060908e8;backdrop-filter:blur(12px);border-bottom:1px solid #26392a}
.logo{font-size:22px;font-weight:800;letter-spacing:.5px}
.logo span{color:var(--red)}
.navlinks{display:flex;gap:22px;color:var(--muted);font-size:14px}
.navlinks a:hover{color:white}
.hero{min-height:86vh;display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding:70px 7%;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#060908ee 10%,#06090855 100%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.eyebrow{color:var(--green);font-size:13px;letter-spacing:2px;font-weight:bold}
h1{font-size:clamp(42px,6vw,82px);line-height:1.1;margin:15px 0}
h1 span{color:var(--red);text-shadow:0 0 24px #9b273344}
.lead{color:var(--muted);font-size:18px;max-width:520px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-block;padding:12px 22px;border-radius:10px;font-weight:bold;border:1px solid #506850;transition:.2s}
.btn.primary{background:var(--red);border-color:var(--red);box-shadow:0 8px 30px #9b273322}
.btn.secondary{background:#122017}
.btn:hover{transform:translateY(-2px);filter:brightness(1.12)}
.poster{position:relative;max-width:520px;margin:auto;border:1px solid #526a50;border-radius:24px;overflow:hidden;box-shadow:0 0 80px #0d3d1b55;transform:rotate(1deg)}
.poster img{width:100%;display:block;aspect-ratio:4/5;object-fit:cover;filter:saturate(.7) contrast(1.15) brightness(.65)}
.poster .stamp{position:absolute;bottom:24px;right:22px;left:22px;padding:18px;border-radius:12px;background:#050908d9;border:1px solid #526a50}
.section{padding:80px 7%;max-width:1250px;margin:auto}
.section h2{font-size:36px;margin:0 0 12px}
.section-intro{color:var(--muted);max-width:650px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}
.card{background:linear-gradient(145deg,#122117,#0b120d);border:1px solid #2d4531;border-radius:16px;padding:25px}
.icon{font-size:30px}
.card h3{margin:10px 0 6px}
.card p{color:var(--muted);margin:0;font-size:14px}
.gamebox{display:flex;justify-content:space-between;align-items:center;gap:30px;background:linear-gradient(120deg,#18291b,#0c120e);border:1px solid #455c43;border-radius:22px;padding:32px}
.gamebox p{color:var(--muted)}
footer{padding:30px 7%;border-top:1px solid #26392a;color:#839183;text-align:center;font-size:13px}
@media(max-width:800px){
 .navlinks{gap:10px;font-size:12px}
 .hero{grid-template-columns:1fr;padding-top:45px}
 .poster{max-width:390px}
 .cards{grid-template-columns:1fr}
 .gamebox{flex-direction:column;align-items:flex-start}
 h1{font-size:48px}
}
</style>
